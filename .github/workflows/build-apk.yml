name: Build HB APKs

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.app_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app_name: customer
            customer_mode: "true"
            orders_mode: "false"
          - app_name: manager
            customer_mode: "false"
            orders_mode: "false"
          - app_name: orders
            customer_mode: "false"
            orders_mode: "true"
    env:
      EXPO_PUBLIC_CUSTOMER_MODE: ${{ matrix.customer_mode }}
      EXPO_PUBLIC_ORDERS_MODE: ${{ matrix.orders_mode }}
      EXPO_PUBLIC_API_BASE_URL: https://supermart-jresym3u.manus.space
      EXPO_NO_GIT_STATUS: "1"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Restore source tree
        run: unzip -o HB-source.zip -d .
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests and type check
        run: |
          pnpm vitest run tests/orders.test.ts tests/products.test.ts tests/whatsapp.test.ts
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/HB-${{ matrix.app_name }}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HB-${{ matrix.app_name }}-APK
          path: output/HB-${{ matrix.app_name }}.apk
          retention-days: 30
